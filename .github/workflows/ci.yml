name: Production checks
on:
  push:
    branches: [feat/retell-render-production]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w backend && npm run typecheck -w frontend
      - run: npm test
      - run: npm run build
      - run: npm run secrets:scan
      - run: docker build -f backend/Dockerfile -t nestr-backend .
      - run: docker build -f n8n/Dockerfile -t nestr-n8n-production .
