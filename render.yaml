# Review cost and service names in Blueprint UI before creating resources.
services:
  - type: web
    name: nestr-api
    runtime: docker
    region: singapore
    plan: starter
    branch: feat/retell-render-production
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: nestr-backend-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: ADMIN_BEARER_AUTH
        value: 'true'
      - key: RETELL_ENABLED
        value: 'false'
      - key: VOICE_AUTO_CALL
        value: 'false'
      - key: PUBLIC_SITE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: NESTR_N8N_HOSTPORT
        fromService:
          type: web
          name: nestr-n8n
          property: hostport
  - type: web
    name: nestr-site
    runtime: static
    branch: feat/retell-render-production
    buildCommand: npm ci && npm run build -w frontend
    staticPublishPath: frontend/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: nestr-n8n
    runtime: docker
    region: singapore
    plan: starter
    branch: feat/retell-render-production
    dockerfilePath: ./n8n/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: nestr-n8n-secrets
      - key: PORT
        value: '5678'
      - key: N8N_PORT
        value: '5678'
      - key: N8N_LISTEN_ADDRESS
        value: 0.0.0.0
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase: { name: nestr-n8n-db, property: host }
      - key: DB_POSTGRESDB_PORT
        fromDatabase: { name: nestr-n8n-db, property: port }
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase: { name: nestr-n8n-db, property: database }
      - key: DB_POSTGRESDB_USER
        fromDatabase: { name: nestr-n8n-db, property: user }
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase: { name: nestr-n8n-db, property: password }
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_EDITOR_BASE_URL
        sync: false
      - key: N8N_PROXY_HOPS
        value: '1'
      - key: N8N_SECURE_COOKIE
        value: 'true'
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: 'false'
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: 'true'
      - key: EXECUTIONS_DATA_PRUNE
        value: 'true'
      - key: EXECUTIONS_DATA_MAX_AGE
        value: '168'
      - key: NESTR_BACKEND_HOSTPORT
        fromService: { type: web, name: nestr-api, property: hostport }
databases:
  - name: nestr-n8n-db
    region: singapore
    plan: basic-256mb
    databaseName: n8n
    user: n8n
